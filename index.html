<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDK Akıllı Sözlük</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #d3132a;
      --primary-hover: #ad1023;
      --bg: #f7f5f3;
      --surface: #fff;
      --surface-raised: #fff;
      --surface-soft: #f5f2f0;
      --text: #211b1b;
      --text-muted: #786f6e;
      --border: #e9e2df;
      --shadow: 0 24px 70px rgba(52, 22, 22, .09);
      --shadow-card: 0 8px 28px rgba(52, 22, 22, .055);
      --kelime-color: #b20f25;
      --kelime-bg: #fff0f1;
      --atasozu-color: #b20f25;
      --atasozu-bg: #fff0f1;
      --deyim-color: #b20f25;
      --deyim-bg: #fff0f1;
      --hero-glow: rgba(211, 19, 42, .105);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --primary: #ff334b;
      --primary-hover: #e52039;
      --bg: #0c0b0c;
      --surface: #151314;
      --surface-raised: #1b1819;
      --surface-soft: #211d1e;
      --text: #f6f0f0;
      --text-muted: #a89c9e;
      --border: #332a2c;
      --shadow: 0 24px 70px rgba(0, 0, 0, .4);
      --shadow-card: 0 8px 28px rgba(0, 0, 0, .2);
      --kelime-color: #ff6172;
      --kelime-bg: #32191e;
      --atasozu-color: #ff6172;
      --atasozu-bg: #32191e;
      --deyim-color: #ff6172;
      --deyim-bg: #32191e;
      --hero-glow: rgba(211, 19, 42, .17);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 24px 72px;
      color: var(--text);
      background: radial-gradient(ellipse 68% 390px at 50% -5%, var(--hero-glow), transparent 75%), var(--bg);
      font: 16px/1.65 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background-color .25s, color .25s;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .container { width: min(100%, 920px); margin: 0 auto; }
    .topbar { display: flex; justify-content: flex-start; align-items: center; min-height: 46px; }
    .theme-toggle {
      display: inline-flex; gap: 9px; align-items: center; padding: 8px 13px;
      color: var(--text); background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; box-shadow: 0 4px 14px rgba(35, 15, 15, .045);
      cursor: pointer; font-size: .83rem; font-weight: 700; transition: .2s ease;
    }
    .theme-toggle:hover { border-color: var(--primary); transform: translateY(-1px); }
    .theme-icon { color: var(--primary); font-size: 1rem; line-height: 1; }
    header { max-width: 720px; margin: 54px auto 34px; text-align: center; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 15px;
      color: var(--primary); font-size: .73rem; font-weight: 850; letter-spacing: .16em; text-transform: uppercase;
    }
    .eyebrow::before, .eyebrow::after { width: 20px; height: 1px; content: ""; background: currentColor; opacity: .45; }
    header h1 { margin: 0; color: var(--text); font-size: clamp(2.7rem, 8vw, 5.15rem); font-weight: 850; letter-spacing: -.075em; line-height: 1.03; }
    header h1 span { color: var(--primary); }
    header p { max-width: 480px; margin: 18px auto 0; color: var(--text-muted); font-size: clamp(.95rem, 2.5vw, 1.08rem); }

    .search-box {
      position: relative; z-index: 2; padding: 20px; margin-bottom: 36px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
      box-shadow: var(--shadow);
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 15px; padding: 5px; border: 1px solid var(--border); border-radius: 15px; background: var(--surface-soft); }
    .tab-btn {
      flex: 1; min-width: 0; padding: 10px 12px; border: 0; border-radius: 11px;
      color: var(--text-muted); background: transparent; cursor: pointer;
      font-size: .88rem; font-weight: 720; transition: .18s ease;
    }
    .tab-btn:hover:not(.active) { color: var(--text); background: var(--surface-raised); }
    .tab-btn.active { color: #fff; background: var(--primary); box-shadow: 0 5px 14px rgba(211, 19, 42, .2); }
    .input-wrapper { display: flex; gap: 10px; }
    input[type="text"] {
      flex: 1; min-width: 0; padding: 15px 18px; outline: 0;
      color: var(--text); background: var(--surface-raised); border: 1.5px solid var(--border); border-radius: 14px;
      font-size: 1rem; transition: border-color .18s, box-shadow .18s;
    }
    input[type="text"]::placeholder { color: var(--text-muted); opacity: .8; }
    input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 12%, transparent); }
    .search-btn {
      min-width: 116px; padding: 0 24px; color: white; background: var(--primary); border: 0; border-radius: 14px;
      cursor: pointer; font-weight: 780; transition: .18s ease;
    }
    .search-btn:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(211, 19, 42, .22); }
    .search-btn:disabled { opacity: .65; cursor: wait; transform: none; }

    .suggestions-list {
      position: absolute; top: calc(100% - 7px); left: 20px; right: 20px; z-index: 20;
      display: none; max-height: min(55vh, 430px); overflow-y: auto;
      color: var(--text); background: var(--surface-raised); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 18px 45px rgba(20, 10, 10, .18);
    }
    .suggestion-header { padding: 9px 16px; color: var(--text-muted); background: var(--surface-soft); border-bottom: 1px solid var(--border); font-size: .68rem; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    .suggestion-item { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 16px; color: var(--text); background: transparent; border: 0; border-bottom: 1px solid var(--border); cursor: pointer; text-align: left; transition: background .15s; }
    .suggestion-item:last-child { border-bottom: 0; }
    .suggestion-item:hover, .suggestion-item.selected { background: var(--surface-soft); }
    .suggestion-item .match-bold { color: var(--primary); font-weight: 850; }
    .type-badge, .card-type-tag { color: var(--primary); background: var(--kelime-bg); border-radius: 999px; font-size: .66rem; font-weight: 850; letter-spacing: .06em; text-transform: uppercase; }
    .type-badge { flex: 0 0 auto; padding: 4px 9px; }

    .group-section-title { display: flex; align-items: center; gap: 11px; margin: 36px 0 15px; padding-bottom: 10px; color: var(--text); border-bottom: 1px solid var(--border); font-size: 1.12rem; font-weight: 820; letter-spacing: -.02em; }
    .group-section-title::before { width: 4px; height: 21px; content: ""; background: var(--primary); border-radius: 5px; }
    .group-section-title.kelime-title, .group-section-title.atasozu-title, .group-section-title.deyim-title { color: var(--text); border-color: var(--border); }
    .word-results-list { max-height: min(68vh, 680px); overflow-y: auto; overscroll-behavior: contain; padding: 2px 8px 2px 2px; scrollbar-width: thin; scrollbar-color: var(--primary) transparent; }
    .word-results-list::-webkit-scrollbar { width: 7px; }
    .word-results-list::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 8px; }
    .result-card { margin-bottom: 14px; padding: 22px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-card); animation: appear .28s ease both; }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .card-type-tag { display: inline-flex; margin-bottom: 12px; padding: 4px 10px; }
    .tag-kelime, .tag-atasozu, .tag-deyim { color: var(--primary); background: var(--kelime-bg); }
    .word-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 15px; padding-bottom: 13px; border-bottom: 1px solid var(--border); }
    .word-title-group { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; min-width: 0; }
    .word-title { color: var(--primary); font-size: clamp(1.45rem, 5vw, 1.9rem); font-weight: 850; letter-spacing: -.045em; line-height: 1.2; overflow-wrap: anywhere; }
    .word-origin { color: var(--text-muted); font-size: .84rem; font-style: italic; }
    .icon-btn { flex: 0 0 auto; padding: 8px 11px; color: var(--text); background: var(--surface-soft); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: .82rem; font-weight: 700; transition: .16s; }
    .icon-btn:hover { color: var(--primary); border-color: var(--primary); }
    .meaning-item { margin-bottom: 14px; padding-bottom: 13px; border-bottom: 1px dashed var(--border); }
    .meaning-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: 0; }
    .meaning-number { margin-right: 6px; color: var(--primary); font-weight: 850; }
    .badge { display: inline-block; margin-right: 6px; padding: 2px 7px; color: var(--text-muted); background: var(--surface-soft); border: 1px solid var(--border); border-radius: 6px; font-size: .7rem; font-weight: 750; }
    .example { margin: 10px 0 0 12px; padding: 10px 14px; color: var(--text-muted); background: var(--surface-soft); border-left: 3px solid var(--primary); border-radius: 0 10px 10px 0; font-style: italic; }
    .author { color: var(--text-muted); font-size: .82rem; font-style: normal; font-weight: 700; }
    .sub-section-title { margin: 17px 0 9px; color: var(--text); font-size: .88rem; font-weight: 780; }
    .chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 6px 11px; color: var(--primary); background: var(--kelime-bg); border: 1px solid color-mix(in srgb, var(--primary) 18%, var(--border)); border-radius: 999px; cursor: pointer; font-size: .8rem; font-weight: 680; transition: .16s; }
    .chip:hover { background: color-mix(in srgb, var(--primary) 13%, var(--surface)); transform: translateY(-1px); }
    .status-msg { padding: 24px; color: var(--text-muted); text-align: center; font-size: .95rem; }
    .error-msg { color: var(--primary); }
    .empty-state { padding: 34px 22px; color: var(--text-muted); background: var(--surface); border: 1px dashed var(--border); border-radius: 18px; text-align: center; }
    .empty-state b { color: var(--text); }
    .speech-audio { display: none; width: 100%; margin-top: 12px; }
    button:focus-visible, input:focus-visible, .suggestion-item:focus-visible, .chip:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 55%, white); outline-offset: 3px; }
    @media (max-width: 640px) {
      body { padding: 16px 14px 48px; }
      header { margin: 42px auto 28px; }
      .search-box { padding: 13px; border-radius: 19px; }
      .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 4px; }
      .tab-btn { padding: 9px 5px; font-size: .79rem; }
      .input-wrapper { gap: 7px; }
      input[type="text"] { padding: 13px 12px; font-size: .94rem; }
      .search-btn { min-width: 76px; padding: 0 13px; font-size: .9rem; }
      .suggestions-list { left: 13px; right: 13px; max-height: 58vh; }
      .result-card { padding: 18px 16px; border-radius: 15px; }
      .word-header { align-items: flex-start; }
      .word-results-list { max-height: 62vh; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>

  <div class="container">
    <div class="topbar">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Koyu temaya geç" aria-pressed="false">
        <span class="theme-icon" id="themeIcon" aria-hidden="true">☾</span>
        <span id="themeLabel">Koyu tema</span>
      </button>
    </div>
    <header>
      <div class="eyebrow">Türkçenin yaşayan sözlüğü</div>
      <h1>TDK <span>Akıllı</span><br>Sözlük</h1>
      <p>Kelimelerin anlamına, kökenine ve hikâyesine tek bir aramayla ulaş.</p>
    </header>

    <div class="search-box">
      <!-- Sekmeler -->
      <div class="tabs">
        <button class="tab-btn active" data-mode="hepsi" aria-pressed="true">🔍 Hepsinde Ara</button>
        <button class="tab-btn" data-mode="kelime" aria-pressed="false">📖 Kelimeler</button>
        <button class="tab-btn" data-mode="atasozu" aria-pressed="false">📜 Atasözleri</button>
        <button class="tab-btn" data-mode="deyim" aria-pressed="false">💬 Deyimler</button>
      </div>

      <div class="input-wrapper">
        <input type="text" id="searchInput" placeholder="Bir kelime, atasözü veya deyim arayın…" autocomplete="off" aria-label="Sözlükte ara" aria-controls="suggestions" aria-autocomplete="list">
        <button class="search-btn" id="searchButton" type="button">Ara</button>
      </div>

      <!-- Google Tarzı Canlı Öneri Kutusu -->
      <div id="suggestions" class="suggestions-list"></div>
    </div>

    <!-- Sonuçlar -->
    <div id="results"></div>
    <div id="speechStatus" class="status-msg" role="status" aria-live="polite" hidden></div>
  </div>

  <script>
    const API = '/api';
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');
    let currentTheme = 'light';
    try {
      currentTheme = localStorage.getItem('mytdk-theme') === 'dark' ? 'dark' : 'light';
    } catch (_) {}

    function setTheme(theme) {
      currentTheme = theme;
      document.documentElement.dataset.theme = theme;
      const dark = theme === 'dark';
      themeToggle.setAttribute('aria-pressed', String(dark));
      themeToggle.setAttribute('aria-label', dark ? 'Açık temaya geç' : 'Koyu temaya geç');
      themeIcon.textContent = dark ? '☀' : '☾';
      themeLabel.textContent = dark ? 'Açık tema' : 'Koyu tema';
      try { localStorage.setItem('mytdk-theme', theme); } catch (_) {}
    }
    setTheme(currentTheme);

    let currentMode = 'hepsi';
    let autocompleteData = [];
    let autocompleteReady = false;
    let debounceTimer;
    let selectedIndex = -1;
    let searchRequestId = 0;
    let suggestionRequestId = 0;
    let pendingScrollMode = null;

    const input = document.getElementById('searchInput');
    const suggestions = document.getElementById('suggestions');
    const results = document.getElementById('results');
    const searchButton = document.getElementById('searchButton');

    document.addEventListener('DOMContentLoaded', () => {
      themeToggle.addEventListener('click', () => setTheme(currentTheme === 'dark' ? 'light' : 'dark'));
      loadAutocompleteData();
      input.addEventListener('input', handleLiveInput);
      input.addEventListener('keydown', handleKeyDown);
      searchButton.addEventListener('click', () => ara());
      document.querySelector('.tabs').addEventListener('click', event => {
        const button = event.target.closest('[data-mode]');
        if (!button) return;
        currentMode = button.dataset.mode;
        document.querySelectorAll('.tab-btn').forEach(tab => {
          const active = tab === button;
          tab.classList.toggle('active', active);
          tab.setAttribute('aria-pressed', String(active));
        });
        handleLiveInput();
      });
      suggestions.addEventListener('click', event => {
        const item = event.target.closest('.suggestion-item');
        if (item) selectSuggestion(item.dataset.text, item.dataset.mode);
      });
      results.addEventListener('click', event => {
        const speech = event.target.closest('[data-speak]');
        if (speech) {
          if (speech.dataset.audio) playTDKAudio(speech.dataset.audio, speech.dataset.speak);
          else sesliOku(speech.dataset.speak);
        }
        const related = event.target.closest('[data-search]');
        if (related) { input.value = related.dataset.search; ara(); }
      });
      document.addEventListener('click', event => {
        if (!event.target.closest('.search-box')) hideSuggestions();
      });
    });

    async function loadAutocompleteData() {
      try {
        const data = await fetchJSON(`${API}/autocomplete`);
        autocompleteData = Array.isArray(data) ? data.filter(item => item && item.madde) : [];
      } catch (error) {
        console.warn('Kelime öneri listesi yüklenemedi:', error);
        autocompleteData = [];
      } finally {
        autocompleteReady = true;
        if (input.value.trim().length >= 2) handleLiveInput();
      }
    }

    function normalize(text) { return String(text || '').toLocaleLowerCase('tr-TR').trim(); }
    function capitalizeInitial(text) {
      const value = String(text ?? '');
      const firstLetter = value.search(/[a-zçğıöşü]/i);
      if (firstLetter < 0) return value;
      return value.slice(0, firstLetter) + value[firstLetter].toLocaleUpperCase('tr-TR') + value.slice(firstLetter + 1);
    }
    function escapeHTML(text) {
      return String(text ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }
    function formatDictionaryText(text) {
      return escapeHTML(text).replace(/&lt;(\/)?(i|em|b|strong)&gt;/gi, '<$1$2>');
    }
    function plainText(text) {
      return String(text ?? '').replace(/<[^>]*>/g, '').replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&');
    }
    function hideSuggestions() { suggestions.style.display = 'none'; selectedIndex = -1; }

    function handleLiveInput() {
      clearTimeout(debounceTimer);
      const query = normalize(input.value);
      selectedIndex = -1;
      const requestId = ++suggestionRequestId;
      if (query.length < 2) { hideSuggestions(); return; }
      const quickWords = (currentMode === 'hepsi' || currentMode === 'kelime')
        ? autocompleteData.filter(item => normalize(item.madde).startsWith(query))
            .sort((a, b) => normalize(a.madde).localeCompare(normalize(b.madde), 'tr-TR'))
        : [];
      renderSuggestions(quickWords, [], query, true);
      suggestions.style.display = 'block';
      debounceTimer = setTimeout(async () => {
        let words = [];
        if (currentMode === 'hepsi' || currentMode === 'kelime') {
          try {
            words = await fetchJSON(`${API}/suggestions?ara=${encodeURIComponent(input.value.trim())}`);
          } catch (_) {
            words = autocompleteData.filter(item => normalize(item.madde).startsWith(query));
          }
        }
        let expressions = [];
        try { expressions = await fetchAtasozuDeyim(input.value.trim()); } catch (_) {}
        if (requestId !== suggestionRequestId || normalize(input.value) !== query) return;
        renderSuggestions(words, expressions, query);
      }, 180);
    }

    function renderSuggestions(words, expressions, query, loading = false) {
      let html = '';
      const addGroup = (title, items, label, className, mode) => {
        if (!items.length) return;
        html += `<div class="suggestion-header">${title}</div>`;
        items.forEach(item => {
          const text = item.text;
          const safe = escapeHTML(text);
          const idx = normalize(text).indexOf(query);
          const display = idx < 0 ? safe : `${escapeHTML(text.slice(0, idx))}<span class="match-bold">${escapeHTML(text.slice(idx, idx + query.length))}</span>${escapeHTML(text.slice(idx + query.length))}`;
          html += `<button type="button" class="suggestion-item" role="option" aria-selected="false" data-mode="${mode}" data-text="${safe}"><span>${display}</span><span class="type-badge ${className}">${label}</span></button>`;
        });
      };
      if (currentMode === 'hepsi' || currentMode === 'kelime') addGroup('📖 Kelimeler', words.map(x => ({text:x.madde})), 'Kelime', 'tag-kelime', 'kelime');
      if (currentMode === 'hepsi' || currentMode === 'atasozu') addGroup('📜 Atasözleri', expressions.filter(x => normalize(x.turu2) === 'atasözü').map(x => ({text:x.soz})), 'Atasözü', 'tag-atasozu', 'atasozu');
      if (currentMode === 'hepsi' || currentMode === 'deyim') addGroup('💬 Deyimler', expressions.filter(x => normalize(x.turu2) !== 'atasözü').map(x => ({text:x.soz})), 'Deyim', 'tag-deyim', 'deyim');
      if (loading) html += '<div class="suggestion-header">Daha fazla öneri yükleniyor…</div>';
      suggestions.innerHTML = html;
      suggestions.style.display = html ? 'block' : 'none';
    }

    function handleKeyDown(event) {
      const items = [...suggestions.querySelectorAll('.suggestion-item')];
      if (event.key === 'Escape') { hideSuggestions(); return; }
      if (!items.length || suggestions.style.display === 'none') {
        if (event.key === 'Enter') { event.preventDefault(); ara(); }
        return;
      }
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        selectedIndex = (selectedIndex + (event.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        items.forEach((item, index) => {
          item.classList.toggle('selected', index === selectedIndex);
          item.setAttribute('aria-selected', String(index === selectedIndex));
        });
        return;
      }
      if (event.key === 'Enter') {
        event.preventDefault();
        if (selectedIndex >= 0) selectSuggestion(items[selectedIndex].dataset.text, items[selectedIndex].dataset.mode);
        else ara();
      }
    }

    function selectSuggestion(text, mode) {
      input.value = text;
      hideSuggestions();
      pendingScrollMode = mode || currentMode;
      currentMode = pendingScrollMode;
      document.querySelectorAll('.tab-btn').forEach(tab => {
        const active = tab.dataset.mode === currentMode;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-pressed', String(active));
      });
      ara();
    }

    async function fetchJSON(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`TDK servisi ${response.status} yanıtı verdi`);
      return response.json();
    }
    async function fetchKelime(query) {
      const data = await fetchJSON(`${API}/gts?ara=${encodeURIComponent(query)}`);
      if (data && data.error) return [];
      return Array.isArray(data) ? data : [];
    }
    async function fetchAtasozuDeyim(query) {
      const data = await fetchJSON(`${API}/atasozu?ara=${encodeURIComponent(query)}`);
      return Array.isArray(data) && !data.error ? data.map(item => ({
        ...item,
        soz: item.soz || item.sozum || '',
        anlam: item.anlam || item.anlami || '',
        turu2: item.turu2 || item.tur || 'Deyim'
      })).filter(item => item.soz) : [];
    }

    function mergeWordEntries(entries) {
      const groups = new Map();
      entries.forEach(item => {
        if (!item || !item.madde) return;
        const key = normalize(item.madde);
        if (!groups.has(key)) groups.set(key, {...item, anlamlarListe: [], atasozu: []});
        const group = groups.get(key);
        const meanings = new Map(group.anlamlarListe.map(meaning => [meaning.anlam_id || normalize(meaning.anlam), meaning]));
        (item.anlamlarListe || []).forEach(meaning => meanings.set(meaning.anlam_id || normalize(meaning.anlam), meaning));
        group.anlamlarListe = [...meanings.values()];
        const related = new Map(group.atasozu.map(entry => [normalize(entry.madde), entry]));
        (item.atasozu || []).forEach(entry => related.set(normalize(entry.madde), entry));
        group.atasozu = [...related.values()];
      });
      return [...groups.values()];
    }

    async function ara() {
      const query = input.value.trim();
      if (!query) { input.focus(); results.innerHTML = '<div class="status-msg">Aramak için bir kelime yazın.</div>'; return; }
      hideSuggestions();
      const requestId = ++searchRequestId;
      searchButton.disabled = true;
      results.innerHTML = '<div class="status-msg">TDK sözlüklerinde aranıyor…</div>';
      const needWord = currentMode === 'hepsi' || currentMode === 'kelime';
      const needExpressions = currentMode === 'hepsi' || currentMode === 'atasozu' || currentMode === 'deyim';
      const requests = await Promise.allSettled([
        needWord ? fetchKelime(query) : Promise.resolve([]),
        needExpressions ? fetchAtasozuDeyim(query) : Promise.resolve([])
      ]);
      if (requestId !== searchRequestId) return;
      searchButton.disabled = false;
      const [wordResult, expressionResult] = requests;
      if (requests.every((result, index) => ![needWord, needExpressions][index] || result.status === 'rejected')) {
        results.innerHTML = '<div class="status-msg error-msg">TDK sözlük servisi yanıt vermedi. Biraz sonra yeniden deneyin.</div>';
        return;
      }
      const words = wordResult.status === 'fulfilled' ? mergeWordEntries(wordResult.value) : [];
      const expressions = expressionResult.status === 'fulfilled' ? expressionResult.value : [];
      renderCategorizedResults(words, expressions.filter(x => normalize(x.turu2) === 'atasözü'), expressions.filter(x => normalize(x.turu2) !== 'atasözü'), query);
      const scrollMode = pendingScrollMode;
      pendingScrollMode = null;
      if (scrollMode) requestAnimationFrame(() => document.getElementById(`${scrollMode}-results`)?.scrollIntoView({behavior: 'smooth', block: 'start'}));
      if (requests.some((result, index) => [needWord, needExpressions][index] && result.status === 'rejected')) {
        results.insertAdjacentHTML('afterbegin', '<div class="status-msg">Bazı sözlük kaynaklarına ulaşılamadı; aşağıdaki sonuçlar kısmi olabilir.</div>');
      }
    }

    function renderCategorizedResults(words, proverbs, idioms, query) {
      let html = '';
      const speechButton = (text, soundCode = '') => `<button type="button" class="icon-btn" data-speak="${escapeHTML(text)}"${soundCode ? ` data-audio="${escapeHTML(soundCode)}"` : ''}>🔊 Oku</button>`;
      if ((currentMode === 'hepsi' || currentMode === 'kelime') && words.length) {
        html += '<div id="kelime-results" class="group-section-title kelime-title">📖 Kelime Sonuçları</div><div class="word-results-list">';
        words.forEach(item => {
          html += `<article class="result-card"><span class="card-type-tag tag-kelime">Kelime</span><div class="word-header"><div class="word-title-group"><span class="word-title">${escapeHTML(item.madde)}</span>${item.lisan ? `<span class="word-origin">${escapeHTML(item.lisan)}</span>` : ''}</div>${speechButton(item.madde || '', item.seskod || '')}</div><div class="meanings">`;
          (item.anlamlarListe || []).forEach(meaning => {
            const badges = (meaning.ozelliklerListe || []).map(feature => `<span class="badge">${escapeHTML(feature.tam_adi)}</span>`).join('');
            let example = '';
            if (meaning.orneklerListe && meaning.orneklerListe.length) {
              const first = meaning.orneklerListe[0];
              const author = first.yazar && first.yazar.length ? `— ${escapeHTML(first.yazar[0].tam_adi)}` : '';
              example = `<div class="example">“${formatDictionaryText(first.ornek)}” <span class="author">${author}</span></div>`;
            }
            const spokenMeaning = [plainText(capitalizeInitial(meaning.anlam)), plainText(meaning.orneklerListe?.[0]?.ornek)].filter(Boolean).join('. ');
            html += `<div class="meaning-item"><div><span class="meaning-number">${escapeHTML(meaning.anlam_sira)}.</span>${badges}<span>${formatDictionaryText(capitalizeInitial(meaning.anlam))}</span></div>${example}<button type="button" class="icon-btn" data-speak="${escapeHTML(spokenMeaning)}">🔊 Anlamı oku</button></div>`;
          });
          html += '</div>';
          if (item.atasozu && item.atasozu.length) {
            html += '<div class="sub-section-title">İlişkili sözler</div><div class="chip-list">';
            item.atasozu.forEach(related => { html += `<button type="button" class="chip chip-deyim" data-search="${escapeHTML(related.madde)}">${escapeHTML(related.madde)}</button>`; });
            html += '</div>';
          }
          html += '</article>';
        });
        html += '</div>';
      }
      const addExpressionGroup = (items, mode, title, label, tagClass) => {
        if ((currentMode !== 'hepsi' && currentMode !== mode) || !items.length) return;
        html += `<div id="${mode}-results" class="group-section-title ${mode}-title">${title}</div>`;
        items.forEach(item => { const spokenText = [item.soz, plainText(capitalizeInitial(item.anlam))].filter(Boolean).join('. '); html += `<article class="result-card"><span class="card-type-tag ${tagClass}">${label}</span><div class="word-header"><span class="word-title" style="font-size:1.4rem;color:var(--text)">${escapeHTML(item.soz)}</span>${speechButton(spokenText)}</div><div class="meaning-item"><span style="font-size:1.05rem">${formatDictionaryText(capitalizeInitial(item.anlam))}</span><br><button type="button" class="icon-btn" data-speak="${escapeHTML(plainText(capitalizeInitial(item.anlam)))}">🔊 Anlamı oku</button></div></article>`; });
      };
      addExpressionGroup(proverbs, 'atasozu', '📜 Atasözleri', 'Atasözü', 'tag-atasozu');
      addExpressionGroup(idioms, 'deyim', '💬 Deyimler', 'Deyim', 'tag-deyim');
      results.innerHTML = html || `<div class="empty-state"><div style="font-size:1.8rem;margin-bottom:8px">🔎</div><b>“${escapeHTML(query)}”</b> için sonuç bulunamadı.<br><span>Yazımı kontrol edebilir veya farklı bir arama deneyebilirsiniz.</span></div>`;
    }

    let speechRequestId = 0;
    let activeSpeechAudio = null;
    let activeSpeechUrl = null;
    function stopSpeechAudio() {
      if (activeSpeechAudio) activeSpeechAudio.pause();
      if (activeSpeechUrl) URL.revokeObjectURL(activeSpeechUrl);
      activeSpeechAudio = null;
      activeSpeechUrl = null;
    }

    async function sesliOku(text) {
      const status = document.getElementById('speechStatus');
      const requestId = ++speechRequestId;
      stopSpeechAudio();
      if (activeTDKAudio) { activeTDKAudio.pause(); activeTDKAudio = null; }
      status.replaceChildren();
      status.hidden = true;
      try {
        const response = await fetch(`${API}/tts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: plainText(text) })
        });
        if (!response.ok) throw new Error('Türkçe ses üretilemedi.');
        const audioUrl = URL.createObjectURL(await response.blob());
        if (requestId !== speechRequestId) { URL.revokeObjectURL(audioUrl); return; }
        const audio = new Audio(audioUrl);
        activeSpeechAudio = audio;
        activeSpeechUrl = audioUrl;
        audio.addEventListener('ended', stopSpeechAudio, { once: true });
        try {
          await audio.play();
        } catch (_) {
          status.textContent = 'Ses hazır. Dinlemek için oynat düğmesine basın.';
          audio.controls = true;
          audio.className = 'speech-audio';
          audio.style.display = 'block';
          status.appendChild(audio);
          status.hidden = false;
        }
      } catch (error) {
        if (requestId !== speechRequestId) return;
        status.textContent = 'Çevrimiçi ses hizmetine ulaşılamadı. Biraz sonra tekrar deneyin.';
        status.hidden = false;
      }
    }

    let activeTDKAudio = null;
    function playTDKAudio(soundCode, fallbackText) {
      speechRequestId++;
      stopSpeechAudio();
      if (activeTDKAudio) {
        activeTDKAudio.pause();
        activeTDKAudio = null;
      }
      const audio = new Audio(`${API}/ses/${encodeURIComponent(soundCode)}.wav`);
      activeTDKAudio = audio;
      let fallbackStarted = false;
      const fallback = () => {
        if (fallbackStarted) return;
        fallbackStarted = true;
        sesliOku(fallbackText);
      };
      audio.addEventListener('error', () => {
        if (activeTDKAudio === audio) activeTDKAudio = null;
        fallback();
      }, { once: true });
      audio.play().catch(fallback);
    }
  </script>
</body>
